[project]
name = "transaction-recognition"
version = "0.1.0"
description = "Explainable, video-only transaction evidence service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "SQLAlchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
  "ultralytics>=8.3,<9",
  "mediapipe>=0.10.21,<1",
  "supervision>=0.30.0,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
